<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="/boundless-whbis/assets/uni.d03b16d8.css">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <script>
      /* 基址感知静态资源（hash 路由下 location.pathname 即 router.base）：
         在任何 CSS 应用前写入 --app-bg-image 并修正 favicon 前缀，
         避免 App.vue 的兜底 url('/static/background.jpg') 在子路径部署下先发一次根路径 404 */
      (function () {
        var base = location.pathname.replace(/[^/]*$/, '')
        if (base.charAt(base.length - 1) !== '/') base += '/'
        document.documentElement.style.setProperty('--app-bg-image', 'url("' + base + 'static/background.jpg")')
        var fav = document.querySelector('link[rel="icon"]')
        if (fav) fav.setAttribute('href', base + 'static/logo.png')
      })()
    </script>
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title>武汉公交信息实时查询</title>
    <!--preload-links-->
    <!--app-context-->
    <script type="module" crossorigin src="/boundless-whbis/assets/index-DL_R1f7M.js"></script>
    <link rel="stylesheet" crossorigin href="/boundless-whbis/assets/index-aHhu143R.css">
  </head>
  <body>
    <div id="app"><!--app-html--></div>
  </body>
</html>
