name: 自动采集 + 自动发布

# 需求 2/3/5：基于 GitHub Actions + Pages 全自动采集武汉公交集团、木兰、汉奇、蔡城线路，
# 交叉验证后同步到源码分支并提交，再构建并部署到 Pages。
#
# 数据来源标注规则：每轮采集（全量/增量）都会逐方向重新探测上游 /line 站点签名，
# 高德官方站点命中即复用。收尾时 auto-collect.mjs 在 Actions 日志里逐条、分组打印
# 全部线路的站点来源：营运公司 / 线路号 / 高德站点 or OSRM 兜底 / 信息存储文件名，
# 并把 OSRM 兜底线路导出 reports/osrm-lines.json 随 reports 提交。
# 排查走向偏差/回环时先查日志与清单（如 646 路已用高德站点，不在兜底清单内）。
#
# ⚠ GitHub 硬规则：schedule / workflow_dispatch 只认「默认分支」上的 workflow 文件。
#   本仓库需把默认分支设为 main（Settings → Branches → Default branch）。
#   Pages 发布源仍是明确的 pages 分支，改默认分支不影响站点。
#   未改默认分支前，可手动在 Actions 页面对本工作流点「Run workflow」触发（会使用 main 上的文件）。
on:
  push:
    branches: [main]
  schedule:
    # 每 37 分钟一次（cron 分钟字段按小时取模：每小时的 00/37 分触发，
    # 间隔 37min / 23min 交替，平均约 30min——这是标准 5 段 cron 能表达的最密粒度）。
    # 采集器并发+断点续跑，高频轮次靠 concurrency 排队不重叠。
    - cron: '*/37 * * * *'
    # 周日补充全量重枚举（FULL_SCAN=1），UTC 04:23 = 北京时间 12:23
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: '全量重枚举线路（否则仅规范化 + 增量刷新走向）'
        required: false
        default: false
        type: boolean
      skip_deploy:
        description: '只采集、不构建/部署（自测用）'
        required: false
        default: false
        type: boolean
      overwrite:
        description: '高德 SSR 走向覆盖重写（--overwrite）：用 getPoiNewbus 的 xs/ys 站点序列替换已有 route/stops'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 采集器会逐条写资产/台账，禁止两轮重叠；新轮排队而非取消正在跑的那轮
concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # 上游 /line 经项目自带 Cloudflare Worker 反代（GitHub runner 在美国，直连武汉上游会被墙）
      SCAN_BASE: https://whbis-proxy.lwu584742.workers.dev
      AMAP_KEY: ${{ secrets.AMAP_KEY }}
      AMAP_SECRET: ${{ secrets.AMAP_SECRET }}
      AMAP_WEB_COOKIE: ${{ secrets.AMAP_WEB_COOKIE }}
      FULL_SCAN: ${{ (github.event.schedule == '23 4 * * 0' || inputs.full_scan == true) && '1' || '' }}
      SKIP_DEPLOY: ${{ inputs.skip_deploy == true && '1' || '' }}
      OVERWRITE: ${{ inputs.overwrite == true && '1' || '' }}
    steps:
      - name: 检出（全量历史，避免浅克隆导致 push 报 shallow update not allowed）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 自动采集 → 提交数据 → 部署 Pages
        run: node scripts/auto-collect.mjs
