name: 车辆营运信息采集（15 分钟）

on:
  schedule:
    # 每 15 分钟一次：UTC 00/15/30/45 → 北京时间 08/08:15/08:30/08:45 等，全天不间断
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vehicle-ops
  # 高峰期 GitHub 定时会排队；取消上一轮未完成的采集，避免失败轮次堆积导致实际间隔拉长
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_BASE: https://whbis-proxy.lwu584742.workers.dev
      # Vercel 数据库同步：在 GitHub 仓库 Settings → Secrets 配这两个值
      VEHICLE_OPS_API: ${{ secrets.VEHICLE_OPS_API }}
      VEHICLE_OPS_TOKEN: ${{ secrets.VEHICLE_OPS_TOKEN }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 20 万条 MD5 反查字典缓存：命中后每轮省去现场构建，降低超时概率
      - name: 缓存 MD5 反查字典
        uses: actions/cache@v4
        with:
          path: .cache/vehicle-ops-md5-dict.json
          key: md5-dict-${{ hashFiles('src/utils/md5.js', 'scripts/scan-vehicle-ops.mjs') }}

      - name: 采集全车营运信息
        run: node scripts/scan-vehicle-ops.mjs

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/static/vehicle-ops
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "数据: 车辆营运信息 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
