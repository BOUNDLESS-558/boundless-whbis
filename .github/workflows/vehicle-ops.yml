name: 车辆营运信息采集（15 分钟）

on:
  schedule:
    # 每 15 分钟一次：UTC 00/15/30/45 → 北京时间 08/08:15/08:30/08:45 等，全天不间断
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vehicle-ops
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCAN_BASE: https://whbis-proxy.lwu584742.workers.dev
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集全车营运信息
        run: node scripts/scan-vehicle-ops.mjs

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/static/vehicle-ops
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "数据: 车辆营运信息 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main
            git push origin main
          fi
