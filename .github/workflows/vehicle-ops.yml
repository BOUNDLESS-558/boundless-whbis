name: 车辆营运信息采集（1 分钟）

on:
  # schedule 已停用：GitHub Actions 定时高峰可延迟数小时且丢任务。
  # 改由 Cloudflare Worker Cron 每分钟通过 API 即时触发 workflow_dispatch（见 deploy/CLOUDFLARE-CRON.md）。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vehicle-ops
  # 1 分钟间隔下单轮采集可能超时；排队而非取消，确保每轮能完整跑完并写库，
  # 避免上一轮被取消导致数据缺口。GitHub 高峰期本身会延迟触发，排队不会无限堆积。
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCAN_BASE: https://whbis-proxy.lwu584742.workers.dev
      # 1 分钟间隔需提高并发，确保单轮采集能在 1 分钟内完成（脚本默认 6，这里提到 16）
      OPS_CONCURRENCY: 16
      # Vercel 数据库同步：在 GitHub 仓库 Settings → Secrets 配这两个值
      VEHICLE_OPS_API: ${{ secrets.VEHICLE_OPS_API }}
      VEHICLE_OPS_TOKEN: ${{ secrets.VEHICLE_OPS_TOKEN }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 20 万条 MD5 反查字典缓存：命中后每轮省去现场构建，降低超时概率
      - name: 缓存 MD5 反查字典
        uses: actions/cache@v4
        with:
          path: .cache/vehicle-ops-md5-dict.json
          key: md5-dict-${{ hashFiles('src/utils/md5.js', 'scripts/scan-vehicle-ops.mjs') }}

      - name: 采集全车营运信息（直写 Neon 数据库）
        run: node scripts/scan-vehicle-ops.mjs
        # 不再 git commit/push 静态 JSON：1 分钟频率下会把 main 历史与 Vercel 构建撑爆。
        # 数据经 /api/vehicle-ops 直写 Neon，前端数据面板实时读库；静态 JSON 仅本机留存。
