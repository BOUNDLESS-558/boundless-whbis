name: 高德线路走向补全

# ⚠ GitHub 硬规则：schedule / workflow_dispatch 只认「默认分支」上的 workflow 文件。
#   本仓库需把默认分支设为 amap-data（Settings → Branches → Default branch）。
#   Pages 发布源是明确的 pages 分支，改默认分支不影响站点。
on:
  schedule:
    # 北京时间 = UTC+8。要求落在凌晨 3:00~6:00 → 对应 UTC 前一天 19:00~22:00。
    # GitHub cron 只能给一个时刻（不能给区间），选 UTC 19:20 = 北京 03:20：
    #   · 高德日配额北京 0:00 已重置，此时额度充足
    #   · 避开整点（GitHub 建议错峰，整点调度最拥堵）
    #   · 即便 schedule 延迟 30 分钟~2 小时，实际仍落在 3~6 点窗口内，余量 2h40m
    # 每天：只处理台账里没有记录的线路，已采过的绝不重打
    - cron: '20 19 * * *'
    # 每周日 UTC 20:40 = 北京时间周一 04:40：额外重试历史 partial/no-match，
    # 否则这些「试过但没成功」的线路会被台账永久跳过，剩余数据补不齐。
    # done 状态仍被采集器硬性跳过，不会造成重复请求。同样落在 3~6 点窗口内。
    - cron: '40 20 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: '只采这些线路号（逗号分隔，留空 = 全量断点续跑）'
        required: false
        default: ''
      max_lines:
        description: '本轮最多实际处理线路数（0 = 不限）'
        required: false
        default: '0'
      probe:
        description: '仅做连通性探针，不采集、不提交'
        type: boolean
        required: false
        default: false
      retry_unmatched:
        description: '重试历史未命中线路（partial/no-match）；已 done 的线路仍绝不重打'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 采集器有台账并发写风险，禁止两轮重叠；新轮排队而不是取消正在跑的那轮
concurrency:
  group: amap-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出数据分支
        uses: actions/checkout@v4
        with:
          ref: amap-data
          # 全量历史（本分支只有孤立根提交，成本极低）；浅克隆会让后续 commit+push 报
          # "shallow update not allowed"
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 校验 Secret
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          if [ -z "$AMAP_KEY" ]; then
            echo "::error::AMAP_KEY 未配置：请在 Settings → Secrets and variables → Actions 新建 AMAP_KEY（值用轮换后的新 Key），可选再加 AMAP_SECRET"
            exit 1
          fi
          echo "AMAP_KEY 已配置（长度 ${#AMAP_KEY}，值不打印）"

      - name: 台账自检（去重依据）
        if: ${{ github.event_name == 'schedule' || inputs.probe != true }}
        run: |
          node -e "
            const fs=require('fs');
            const p='scripts/.amap-progress.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8').replace(/^\uFEFF/,''));
            const t={}; for(const v of Object.values(j.lines)) t[v]=(t[v]||0)+1;
            console.log('台账已记录 '+Object.keys(j.lines).length+' 条线路：'+JSON.stringify(t));
            console.log('这些线路本轮一律跳过，不会再次请求高德；仅处理未记录或被标记为待重试的线路。');
            const shards=fs.readdirSync('src/static/lines').filter(x=>x.endsWith('.json'));
            console.log('分支内现有分片文件 '+shards.length+' 个（含 manifest.json）。');
          "

      - name: 连通性探针
        continue-on-error: true
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
        run: |
          echo "· 高德 linename（主链路）"
          curl -sS --max-time 25 -o /tmp/amap.json -w '  HTTP %{http_code} / %{time_total}s\n' \
            "https://restapi.amap.com/v3/bus/linename?key=${AMAP_KEY}&city=%E6%AD%A6%E6%B1%89&keywords=337&extensions=all&output=json&citylimit=true"
          head -c 220 /tmp/amap.json; echo
          echo "· 上游 /line（补站点用；境外 runner 可能不通，失败会被采集器标为 transient 而不记账）"
          curl -sS --max-time 25 -o /dev/null -w '  HTTP %{http_code} / %{time_total}s\n' \
            -X POST 'https://customized.wuhanbus.com/gps-resapi/wechat/bus/line' \
            -H 'Content-Type: application/json' -H 'openId: wx_openid_dev_001' \
            -d '{"cityCode":"420100","lineCode":"420100-337-0"}'

      - name: 采集（断点续跑）
        if: ${{ github.event_name == 'schedule' || inputs.probe != true }}
        # 留出余量：步骤超时只是本步失败，后面 !cancelled() 的提交步骤仍会执行，
        # 把已逐条落盘的台账/分片提交出去，避免整轮进度丢失导致次日重复请求。
        timeout-minutes: 150
        env:
          AMAP_KEY: ${{ secrets.AMAP_KEY }}
          AMAP_SECRET: ${{ secrets.AMAP_SECRET }}
          IN_ONLY: ${{ inputs.only }}
          IN_MAX: ${{ inputs.max_lines }}
          IN_RETRY: ${{ inputs.retry_unmatched }}
          WEEKLY_RETRY: ${{ github.event.schedule == '40 20 * * 0' }}
        run: |
          ARGS=()
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          if [ -n "$IN_MAX" ] && [ "$IN_MAX" != "0" ]; then ARGS+=(--max-lines "$IN_MAX"); fi
          if [ "$IN_RETRY" = "true" ] || [ "$WEEKLY_RETRY" = "true" ]; then ARGS+=(--retry-unmatched); fi
          echo "参数：${ARGS[*]:-（无）}"
          node scripts/scan-routes-amap.mjs "${ARGS[@]}"

      - name: 刷新资产清单
        # !cancelled()：采集步骤失败/超时也必须刷新，否则分片与清单会不一致
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.probe != true) }}
        run: node scripts/build-manifest.mjs

      - name: 提交并推送数据
        # 关键：不能用默认的 success()。采集器每条线路都立即写台账，一旦中途失败或
        # 超时被杀，若这步被跳过，本轮进度就随 runner 销毁 → 次日重复请求已采线路。
        # !cancelled() 保证只要 job 没被手动取消，就一定把进度提交回 amap-data。
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.probe != true) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/static/lines scripts/.amap-progress.json
          if git diff --cached --quiet; then
            echo "本轮无数据变化，跳过提交"
            exit 0
          fi
          git diff --cached --stat | tail -n 20
          git commit -m "data: 高德走向自动补全 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:refs/heads/amap-data
