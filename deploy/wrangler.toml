name = "whbis-cron"
main = "cloudflare-cron-worker.js"
compatibility_date = "2026-11-26"

# 免费版每账号 5 个 Cron Trigger，这里用 1 个，每 4 分钟触发 workflow_dispatch。
# 单轮采集约 70~80 秒，4 分钟间隔（240 秒，含待发计划请求后单轮耗时增加仍有余量）远大于单轮耗时，彻底避免排队堆积 / 被取消。
# cron 为 UTC；*/4 * * * * 表示每 4 分钟的第 0 秒。
[triggers]
crons = ["*/4 * * * *"]

# GITHUB_TOKEN 不写在这里，部署后用命令设置：
#   wrangler secret put GITHUB_TOKEN
# 需要一个有 repo 权限的 GitHub Personal Access Token（Fine-grained: Actions 读写）。
